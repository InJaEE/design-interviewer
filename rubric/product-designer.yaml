id: product-designer
display_name: 프로덕트 디자이너
scale:
  1: 기대 수준에 미치지 못하는 일관된 근거
  2: 제한된 범위에서 일부 근거
  3: 해당 직급에서 기대하는 충분한 근거
  4: 복잡한 상황에서도 강한 근거
  5: 조직의 기준과 역량을 확장하는 근거
competencies:
  problem_framing: {display_name: 문제 정의, weight: high}
  user_understanding: {display_name: 사용자 이해, weight: high}
  product_thinking: {display_name: 제품 사고, weight: high}
  ux_structure: {display_name: 정보 구조와 사용자 흐름, weight: high}
  ui_interaction: {display_name: UI와 상호작용, weight: medium}
  decision_making: {display_name: 의사결정, weight: high}
  collaboration: {display_name: 협업, weight: high}
  execution: {display_name: 실행력, weight: high}
  outcomes_learning: {display_name: 성과와 학습, weight: high}
  leadership: {display_name: 리더십, weight: role_dependent}
rules:
  evidence_required: true
  allow_unrated: true
  fluency_is_not_competency: true
  portfolio_polish_is_not_ownership: true


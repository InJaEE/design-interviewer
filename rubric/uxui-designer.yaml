id: uxui-designer
display_name: UX/UI 디자이너
scale:
  1: 기대 수준에 미치지 못하는 일관된 근거
  2: 제한된 범위에서 일부 근거
  3: 해당 직급에서 기대하는 충분한 근거
  4: 복잡한 상황에서도 강한 근거
  5: 조직의 기준과 역량을 확장하는 근거
competencies:
  problem_framing: {display_name: 문제 정의, weight: high}
  user_understanding: {display_name: 사용자 이해, weight: high}
  information_architecture: {display_name: 정보 구조, weight: high}
  interaction_design: {display_name: 상호작용 설계, weight: high}
  visual_design: {display_name: 시각 디자인, weight: high}
  accessibility: {display_name: 접근성, weight: medium}
  design_systems: {display_name: 디자인 시스템, weight: medium}
  collaboration: {display_name: 협업, weight: high}
  execution: {display_name: 실행력, weight: high}
  outcomes_learning: {display_name: 성과와 학습, weight: medium}
rules:
  evidence_required: true
  allow_unrated: true
  fluency_is_not_competency: true
  visual_taste_is_not_a_rubric: true


id: portfolio-story-evidence
display_name: 포트폴리오 설명 판단 근거 가이드
purpose: 포트폴리오에서 문제, 지원자의 실제 기여와 최종 결과에 이르는 의사결정 과정이 얼마나 명확하게 드러나는지 확인한다

dimensions:
  problem_clarity:
    display_name: 문제의 명확성
    evidence_trace:
      - 영향을 받은 사용자 또는 대상
      - 문제가 발생한 상황
      - 구체적인 어려움 또는 기회
      - 문제의 중요성과 영향
      - 문제라고 판단한 근거와 범위
    strong_signals:
      - 누가 어떤 상황에서 어떤 어려움을 겪었는지 구체적이다
      - 사용자와 사업에 미친 영향을 설명한다
      - 여러 문제 중 이 문제를 선택한 이유와 범위가 있다
      - 프로젝트 중 문제 정의가 바뀌었다면 그 이유를 설명한다
    weak_signals:
      - 사용성 또는 사용자 경험을 개선했다는 선언만 있다
      - 사용자와 문제가 발생한 상황이 없다
      - 해결 방법을 문제처럼 표현한다
      - 구체적인 숫자는 있지만 출처, 수집 방법과 해석이 없다
    follow_ups:
      - 어떤 사용자가 어떤 상황에서 겪은 문제인가요?
      - 그 현상을 문제라고 판단한 근거는 무엇인가요?
      - 사용자와 사업에는 각각 어떤 영향을 주고 있었나요?
      - 여러 문제 중 이것을 먼저 해결한 이유는 무엇인가요?
      - 프로젝트를 진행하며 처음 정의한 문제가 바뀌었나요?
      - 해당 수치나 조사 결과는 어떻게 수집했나요?

  ownership_clarity:
    display_name: 실제 기여의 명확성
    evidence_trace:
      - 팀과 직군별 역할
      - 지원자가 직접 책임진 범위
      - 공동으로 결정한 부분
      - 지원자가 직접 수행한 행동과 판단
      - 다른 사람이 주도하고 지원자가 기여한 부분
    strong_signals:
      - 개인 책임과 공동 책임을 구분한다
      - 직접 수행한 조사, 설계와 의사결정을 구체적으로 설명한다
      - 팀원이 주도한 부분을 솔직하게 밝힌다
      - 공동 결정에서 자신의 기여와 책임 범위를 설명한다
      - 혼자 한 일의 양보다 맡은 범위의 판단과 결과를 보여준다
    weak_signals:
      - 모든 활동의 주어가 팀이어서 지원자의 행동을 알 수 없다
      - 팀 프로젝트의 모든 성과를 자신의 성과처럼 표현한다
      - 사용한 방법만 나열하고 누가 수행하고 판단했는지 없다
      - 기여율 숫자만 있고 실제 책임과 행동이 없다
      - 혼자 수행한 업무량을 협업이나 리더십의 근거로 사용한다
    follow_ups:
      - 이 프로젝트에서 처음부터 끝까지 직접 책임진 범위는 무엇이었나요?
      - 팀원과 함께 결정한 부분은 무엇이었나요?
      - 다른 사람이 주도하고 본인이 기여한 부분은 무엇인가요?
      - 본인의 의견이나 행동으로 달라진 결정 하나를 설명해 주세요
      - 프로젝트 결과 중 본인의 기여라고 보기 어려운 부분도 있나요?

  decision_trace:
    display_name: 의사결정 과정의 명확성
    evidence_trace:
      - 검토한 대안
      - 대안별 장점, 단점과 제약
      - 유지하려 한 가치와 포기한 가치
      - 선택과 제외에 사용한 기준
      - 판단을 바꾼 정보
      - 최종 결정과 결과
    strong_signals:
      - 대안마다 충족하거나 포기한 조건을 설명한다
      - 사용자 가치, 정보 우선순위, 사업 목표와 기술 조건을 비교한다
      - 선택하지 않은 방향의 제외 이유가 구체적이다
      - 취향보다 프로젝트 목표와 근거를 선택 기준으로 사용한다
      - 새로운 정보에 따라 판단이 바뀐 과정을 보여준다
      - 결과가 좋지 않아도 선택 당시의 근거와 이후 학습을 설명한다
    weak_signals:
      - 최종 결과만 있고 선택 과정이 없다
      - 여러 시안을 나열하지만 차이와 선택 이유가 없다
      - 더 깔끔하거나 사용성이 좋다는 추상적인 이유만 있다
      - 결과가 좋았다는 이유로 과거 선택이 모두 옳았다고 설명한다
      - 선택하지 않은 결과를 단순히 완성도가 낮은 안으로만 묘사한다
    follow_ups:
      - 최종안 이전에 검토한 다른 방향은 무엇이었나요?
      - 각 대안이 충족하거나 포기한 조건은 무엇이었나요?
      - 선택에 가장 큰 영향을 준 정보는 무엇이었나요?
      - 당시에는 선택했지만 지금은 다르게 판단할 부분이 있나요?
      - 최종안에서 기대한 결과가 없었다면 다음으로 무엇을 확인했을까요?

evaluation_cautions:
  - 포트폴리오 표현이 부족한 것과 실제 실무 역량 부족을 구분한다
  - 최종안만 있다는 이유로 낮게 평가하지 않고 면접에서 과정을 확인한다
  - NDA, 보안과 분량 제한으로 과정이나 화면을 공개하지 못할 수 있음을 고려한다
  - 검토한 대안의 개수나 중간 시안의 양을 역량으로 평가하지 않는다
  - 개인 기여율 숫자를 정확한 책임 범위로 가정하지 않는다
  - 공동 작업이 많거나 개인 범위가 작다는 이유로 낮게 평가하지 않는다
  - 구체적인 정량 수치가 있다는 이유만으로 문제 근거가 강하다고 판단하지 않는다
  - 화면이 적어도 문제와 판단 과정이 구체적일 수 있음을 인정한다
  - 포트폴리오에 없는 내용은 낮은 점수보다 추가 확인 대상으로 기록한다

source_usage:
  portfolio:
    expectation: 세 차원의 명확성을 관찰하고 누락은 추가 확인 대상으로 기록한다
    missing_detail_is_negative_evidence: false
  interview:
    expectation: 포트폴리오에 보이지 않는 문제, 역할과 선택 과정을 확인한다
  coaching:
    expectation: 사용자의 실제 프로젝트를 문제, 역할, 대안과 판단 기준 중심으로 재구성한다
    eligible_for_hiring: false

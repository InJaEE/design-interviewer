id: early-career-project-evidence
display_name: 실무 경험이 적은 지원자의 프로젝트 판단 근거 가이드
purpose: 출시 경험, 많은 사용자 데이터와 사업 지표가 부족한 프로젝트에서도 가설 검증, 문제 선택과 제품 관점의 판단을 공정하게 확인한다

project_context:
  type: production | side_project | school | competition | hiring_assignment
  launched: true | false | unknown
  real_users_available: true | false | limited | unknown
  business_data_available: true | false | limited | unknown
  constraints:
    - 시간
    - 사용자 접근
    - 데이터 접근
    - 예산과 도구
    - NDA와 보안

dimensions:
  small_scale_validation:
    display_name: 접근 가능한 범위의 가설 검증
    evidence_trace:
      - 처음 생각 또는 가설
      - 확인 대상과 방법을 선택한 이유
      - 실제로 확인한 내용
      - 예상과 달랐던 발견
      - 바뀐 판단과 디자인
      - 결과를 일반화하기 어려운 이유
      - 다음으로 확인할 내용
    strong_signals:
      - 처음 가설과 실제 확인 결과의 차이를 설명한다
      - 조사 대상이 목표 사용자와 어떻게 비슷하거나 다른지 설명한다
      - 관찰한 사실과 자신의 해석을 구분한다
      - 확인 결과를 문제 정의 또는 디자인 변경에 반영한다
      - 작은 표본과 확인 방법의 한계를 인정한다
      - 시간과 자원이 더 있다면 다음 검증을 제안할 수 있다
    weak_signals:
      - 인터뷰나 테스트를 했다는 사실만 강조한다
      - 조사 인원수 자체를 검증의 품질로 제시한다
      - 편의상 만난 사람을 전체 사용자처럼 일반화한다
      - 처음 생각을 확인하는 방향의 질문만 사용한다
      - 확인 결과와 디자인 변경이 연결되지 않는다
      - 작은 조사 결과를 시장 전체의 사실처럼 표현한다
    follow_ups:
      - 누구에게 확인했고 목표 사용자와 어떻게 비슷하거나 달랐나요?
      - 처음 예상과 가장 달랐던 내용은 무엇인가요?
      - 확인 결과로 실제 디자인을 바꾼 부분은 무엇인가요?
      - 이 결과를 일반화하기 어려운 이유는 무엇인가요?
      - 시간과 자원이 더 있었다면 다음으로 무엇을 확인했을까요?

  scoped_problem_selection:
    display_name: 주어진 과제 안에서의 문제 선택
    evidence_trace:
      - 과제에서 주어진 주제와 범위
      - 지원자가 발견하거나 구체화한 문제 후보
      - 중요도와 우선순위 판단 기준
      - 선택한 문제와 선택하지 않은 문제
      - 제한된 기간에 맞춘 범위 조정
    strong_signals:
      - 주어진 주제와 자신이 구체화한 문제를 구분한다
      - 여러 문제 후보와 그 영향을 비교한다
      - 사용자 영향, 심각성, 사업 중요도와 실행 가능성 등을 우선순위에 사용한다
      - 선택하지 않은 문제와 미룬 이유를 설명한다
      - 프로젝트의 시간과 자원에 맞게 문제 범위를 조정한다
    weak_signals:
      - 과제 문장을 자신의 문제 정의처럼 반복한다
      - 솔루션을 먼저 정한 뒤 문제를 끼워 맞춘다
      - 여러 문제를 발견했지만 우선순위 기준이 없다
      - 가장 만들기 쉬운 문제를 선택하고 이유를 설명하지 않는다
      - 모든 문제를 한 번에 해결하려 한다
    follow_ups:
      - 과제에서 주어진 내용과 본인이 새로 정의한 부분을 구분해 주세요
      - 처음 발견한 문제 후보에는 무엇이 있었나요?
      - 어떤 기준으로 우선순위를 정했나요?
      - 선택하지 않은 문제는 무엇이고 왜 미뤘나요?
      - 프로젝트 기간이 달랐다면 우선순위가 바뀌었을까요?

  product_tradeoff_reasoning:
    display_name: 사용자와 제품 조건 사이의 판단
    evidence_trace:
      - 사용자에게 중요한 조건
      - 제품, 운영, 기술 또는 정책상 필요한 조건
      - 실제로 확인한 사실과 남아 있는 가정
      - 서로 다른 조건 사이의 대안
      - 선택 기준과 최종 판단
      - 실제 서비스라면 추가로 확인할 데이터
    strong_signals:
      - 사용자 가치와 제품 목표를 별도로 설명한다
      - 서비스 운영, 기술 또는 정책상 필요한 조건을 구체적으로 고려한다
      - 사용자와 제품 중 하나를 무조건 우선하지 않고 대안을 검토한다
      - 실제로 확인한 조건과 자신의 가정을 구분한다
      - 매출이나 전환율을 임의로 만들지 않는다
      - 실제 서비스라면 필요한 후속 검증을 설명한다
    weak_signals:
      - 비즈니스 관점을 매출과 전환율 언급으로만 표현한다
      - 실제 데이터가 없는데 가상의 성과 수치를 만든다
      - 사용자 가치와 제품 목표를 항상 대립 관계로 본다
      - 운영과 기술 조건을 근거 없이 상상한다
      - 사용자 경험 또는 사업 목표 중 하나만 절대적인 기준으로 사용한다
    follow_ups:
      - 사용자에게 가장 중요한 조건은 무엇이었나요?
      - 제품이나 서비스에는 어떤 조건이 필요했나요?
      - 실제로 확인한 조건과 본인이 가정한 조건을 구분해 주세요
      - 서로 다른 조건이 충돌한 지점은 무엇이었나요?
      - 어떤 대안을 검토하고 무엇을 선택했나요?
      - 실제 서비스였다면 어떤 데이터를 추가로 확인해야 하나요?

evaluation_cautions:
  - 실무 경험이 없는 지원자에게 실제 사업 성과를 요구하지 않는다
  - 조사 인원수, 유료 도구와 데이터 접근 권한으로 지원자를 비교하지 않는다
  - 사용자를 직접 만나지 못했다면 기존 연구, 리뷰 분석, 사용성 점검과 전문가 검토 등 적절한 대안을 인정한다
  - 작은 프로젝트의 판단 근거를 인정하되 실제 조직에서의 실행 경험과 동일하게 취급하지 않는다
  - 가상의 매출, 전환율, 사용자 수와 성과 수치를 만들도록 유도하지 않는다
  - 학교 과제의 제약과 실제 서비스의 제약을 구분한다
  - UI/UX 프로젝트라는 이유로 프로덕트 디자인 경험과 무관하다고 판단하지 않는다
  - 조사 참여자의 동의, 개인정보와 책임 있는 데이터 처리를 확인한다
  - 지원자마다 사용자, 데이터, 시간과 도구에 접근할 수 있는 환경이 다름을 고려한다

source_usage:
  portfolio:
    expectation: 프로젝트 맥락과 접근 가능한 근거에 맞춰 세 차원을 확인한다
    missing_detail_is_negative_evidence: false
  interview:
    expectation: 확인한 사실, 가정, 판단 변화와 후속 검증을 구분한다
  coaching:
    expectation: 실제 경험을 과장하지 않고 프로젝트 판단 과정을 구체화한다
    eligible_for_hiring: false


id: collaboration-evidence
display_name: 협업 판단 근거 가이드
purpose: 협업했다는 선언이 아니라 다른 관점이 제품과 디자인 결정에 어떤 영향을 주었는지 확인한다

evidence_trace:
  - 협업 상대
  - 서로 달랐던 관점, 목표 또는 제약
  - 주고받은 구체적인 의견
  - 함께 사용한 판단 기준
  - 유지하거나 변경한 결정
  - 지원자 본인의 역할과 행동
  - 제품, 사용자 또는 팀에 생긴 결과와 학습

strong_signals:
  - 협업 상대가 중요하게 본 조건과 그 이유를 구체적으로 설명한다
  - 받은 의견이 디자인 또는 제품 결정에 미친 영향을 연결한다
  - 요청을 그대로 수용하는 데 그치지 않고 대안을 함께 검토한다
  - 사용자 가치, 사업 목표, 기술 제약과 구현 비용 등 서로 다른 조건을 비교한다
  - 무엇을 유지하고 무엇을 바꾸거나 포기했는지 설명한다
  - 팀의 결정과 지원자 본인의 역할을 구분한다
  - 결정 이후 제품 또는 일하는 방식의 변화와 학습을 설명한다

weak_signals:
  - 커뮤니케이션을 중요하게 생각한다는 선언으로 끝난다
  - 협업한 직군, 회의 횟수 또는 사용한 도구만 나열한다
  - 원활하게 협업했다거나 사용자 중심으로 결정했다는 일반적인 표현만 있다
  - 개발 가능 여부를 확인하고 수정했다는 결과만 있고 판단 과정이 없다
  - 상대 직군의 요청을 그대로 반영한 것을 협업의 유일한 근거로 제시한다
  - 팀의 활동과 지원자 본인의 판단 및 행동이 구분되지 않는다
  - 누가 설득에 성공했는지만 있고 공동의 판단 기준이 없다

follow_ups:
  - 상대 직군은 무엇을 중요하게 보고 있었나요?
  - 처음 제안에서 어떤 부분이 달라졌고 왜 달라졌나요?
  - 상대의 의견을 그대로 반영하지 않고 다른 대안을 검토한 적이 있나요?
  - 끝까지 유지하려 했던 사용자 또는 제품 가치는 무엇이었나요?
  - 서로 다른 조건 사이에서 어떤 기준으로 결정했나요?
  - 최종 결정 중 본인이 직접 제안하거나 책임진 부분은 어디까지였나요?
  - 결정 이후 제품이나 팀의 일하는 방식에 어떤 변화가 있었나요?

evaluation_cautions:
  - 약한 신호를 즉시 낮은 점수로 처리하지 않고 후속 질문이 필요한 상태로 본다
  - 좋은 협업이 반드시 디자인 변경이나 의견 충돌로 이어진다고 가정하지 않는다
  - 근거를 검토한 뒤 기존 디자인을 유지한 결정도 인정한다
  - 강하게 설득한 행동 자체를 감점하지 않는다
  - 회의 사진과 협업 도구 화면은 보조 자료이며 직접적인 역량 근거가 아니다
  - 개발 지식의 양보다 다른 직군의 조건을 이해하고 판단에 반영한 과정을 본다
  - 포트폴리오 문장력과 실제 협업 역량을 구분한다
  - 좋은 결과와 좋은 협업 과정을 별도로 확인한다

source_usage:
  resume:
    expectation: 협업 주장을 찾고 면접에서 추가로 확인할 질문을 만든다
    missing_detail_is_negative_evidence: false
  portfolio:
    expectation: 협업 전후의 결정, 대안, 제약과 지원자의 기여 흔적을 찾는다
    missing_detail_is_negative_evidence: false
  interview:
    expectation: 실제 상황과 행동을 후속 질문으로 확인한다
  coaching:
    expectation: 사용자의 실제 사례를 evidence_trace에 맞춰 구체화한다
    eligible_for_hiring: false


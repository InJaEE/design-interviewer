id: ai-assisted-work-evidence
display_name: AI 활용 판단 근거 가이드
purpose: AI 도구를 사용했다는 사실보다 AI가 맡은 범위, 디자이너의 판단, 대안 선택, 검증과 최종 책임을 확인한다

evidence_trace:
  - 프로젝트 상황과 AI를 사용한 목적
  - AI에 맡긴 구체적인 작업 범위
  - AI가 생성하거나 정리한 결과
  - 디자이너가 직접 다시 확인한 내용
  - 검토하고 제외하거나 채택한 대안
  - 선택에 사용한 판단 기준
  - 최종 결정과 사람이 수행한 수정
  - 결과를 확인한 방법
  - 남아 있는 한계, 학습과 최종 책임

strong_signals:
  - AI가 담당한 작업과 사람이 담당한 판단 및 행동을 구체적으로 구분한다
  - AI 결과를 그대로 사용하지 않고 프로젝트 맥락에 맞게 검토한다
  - 채택하거나 제외한 대안과 판단 기준을 설명한다
  - AI와 다른 결론을 내리는 것 자체보다 적절한 결과를 선택하는 데 집중한다
  - 결과의 위험도에 맞는 확인 방법을 선택하고 확인 결과를 수정에 반영한다
  - 확인하지 못한 내용과 AI 활용의 한계를 인정한다
  - 최종 결정과 결과에 대한 자신의 책임을 설명한다

weak_signals:
  - 사용한 AI 도구의 이름이나 개수만 나열한다
  - AI로 분석하거나 제작했다는 결과만 있고 본인의 판단이 없다
  - 생성한 대안의 개수를 AI 활용 역량으로 제시한다
  - 최종 결과만 있고 제외한 방향과 선택 기준이 없다
  - AI와 다른 결론을 내렸다는 사실만 전문성으로 제시한다
  - 결과가 그럴듯하다는 이유로 확인 없이 사용한다
  - 프롬프트 작성 능력을 전체 디자인 또는 AI 활용 역량처럼 설명한다

follow_ups:
  - 이 프로젝트에서 AI에게 맡긴 작업과 직접 판단한 작업을 구분해 주세요
  - AI 결과에서 가장 먼저 확인해야 한다고 생각한 부분은 무엇이었나요?
  - AI가 제안했지만 선택하지 않은 방향이 있었나요?
  - 대안을 채택하거나 제외할 때 어떤 기준을 사용했나요?
  - AI가 제안한 방향을 그대로 선택했다면 왜 적절하다고 판단했나요?
  - AI 결과가 틀리거나 프로젝트 맥락에 맞지 않았던 사례가 있었나요?
  - 사용자, 데이터 또는 다른 방법으로 결과를 어떻게 확인했나요?
  - AI 사용 전과 비교해 좋아진 점과 새로 생긴 어려움은 무엇이었나요?
  - 최종 결과에서 본인이 책임져야 한다고 생각한 부분은 무엇인가요?
  - 비공개 정보나 개인정보를 AI에 전달하지 않기 위해 어떤 기준을 사용했나요?

verification_methods:
  - 사용자 확인 또는 사용성 테스트
  - 프로토타입 검증
  - 기존 데이터와 비교
  - 이전 리서치와 교차 확인
  - 디자인 원칙, 일관성과 접근성 검토
  - 기술 가능성 또는 도메인 전문가 확인
  - 실제 출시 이후 결과 확인

evaluation_cautions:
  - AI와 사람의 일을 지나치게 이분법적으로 나누지 않고 의사결정 책임을 확인한다
  - AI 사용 여부, 특정 도구, 최신 도구 또는 유료 도구 사용을 평가하지 않는다
  - 생성한 대안과 사용한 도구의 개수를 역량으로 평가하지 않는다
  - 모든 결과에 사용자 테스트를 요구하지 않고 위험도에 적합한 검증 방식을 본다
  - AI 결과와 다르게 결정했다는 사실 자체를 높게 평가하지 않는다
  - AI를 사용하지 않은 프로젝트를 낮게 평가하지 않는다
  - 좋은 결과와 검증 가능한 판단 과정을 별도로 평가한다
  - 회사 비공개 데이터, 개인정보, 저작권과 안전에 대한 책임 있는 사용을 확인한다
  - 포트폴리오에 상세 과정이 없으면 낮은 점수 대신 추가 확인 대상으로 기록한다

source_usage:
  resume:
    expectation: AI 활용 주장의 범위와 결과를 찾아 추가 확인 질문을 만든다
    missing_detail_is_negative_evidence: false
  portfolio:
    expectation: AI 입력과 결과보다 사람의 확인, 대안 선택, 수정과 결과의 흔적을 찾는다
    missing_detail_is_negative_evidence: false
  interview:
    expectation: 실제 프로젝트 사례에서 판단과 책임을 후속 질문으로 확인한다
  coaching:
    expectation: 사용자의 실제 AI 활용 경험을 evidence_trace에 맞춰 구체화한다
    eligible_for_hiring: false

levels:
  junior:
    scope: 명확한 문제와 지원이 있는 범위
    expected: 기본 원칙을 적용하고 접근 가능한 근거로 가설을 확인하며 새로운 정보와 피드백에 따라 판단을 개선한다
  mid:
    scope: 하나의 기능 또는 프로젝트를 독립적으로 수행하는 범위
    expected: 근거를 바탕으로 대안을 비교하고 협업해 결과를 만든다
  senior:
    scope: 모호하고 복잡한 제품 문제와 여러 이해관계자가 있는 범위
    expected: 문제와 기준을 만들고 중요한 트레이드오프와 결과를 책임진다
  lead:
    scope: 여러 프로젝트 또는 조직 차원의 방향과 품질
    expected: 팀의 의사결정 체계와 역량을 높이고 넓은 영향력을 만든다
